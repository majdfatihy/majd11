<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .contact-form input, .contact-form textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-family: 'Cairo'; }
        .contact-form button { background: var(--secondary-color); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-family: 'Cairo'; font-weight: bold;}
    </style>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-code"></i> موقعي بـ AI</h1>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="privacy.html">سياسة الخصوصية</a></li>
                <li><a href="terms.html">شروط الاستخدام</a></li>
                <li><a href="contact.html">اتصل بنا</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <h2 style="text-align: center; margin-bottom: 20px;">اتصل بنا</h2>
            <form class="contact-form">
                <input type="text" placeholder="الاسم الكريم" required>
                <input type="email" placeholder="البريد الإلكتروني" required>
                <textarea rows="5" placeholder="رسالتك..." required></textarea>
                <button type="submit">إرسال الرسالة</button>
            </form>
        </section>
        <div id="ad-rectangle"></div>
    </main>

    <footer>
        <!-- نفس الفوتر والأيقونات -->
        <p>&copy; 2026 جميع الحقوق محفوظة لـ موقعي بـ AI.</p>
    </footer>
    <script src="ads.js"></script>
</body>
</html>
